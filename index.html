<style>
  :root{
    --bg:#08070d;
    --violet:#8b5cf6;
    --violet-lo:#6d4df0;
    --violet-hi:#a78bfa;
    --card:rgba(255,255,255,.04);
    --card-hi:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.09);
    --text:#f4f2f8;
    --muted:#9b96ac;
    --radius:18px;
    --maxw:540px;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    min-height:100svh;
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:clamp(24px,6vw,52px) 18px 40px;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(70% 46% at 50% -8%, rgba(109,77,240,.30) 0%, transparent 68%),
      radial-gradient(50% 34% at 8% 42%, rgba(139,92,246,.11) 0%, transparent 70%),
      radial-gradient(58% 40% at 100% 104%, rgba(76,60,160,.20) 0%, transparent 70%);
  }

  main{position:relative;width:100%;max-width:var(--maxw)}

  /* Staggered entrance. Lives on the <li>/<h2> wrapper, never on the card
     itself — the card keeps its transform free for :hover. */
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .reveal{animation:rise .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}

  /* ================= hero ================= */

  .hero{text-align:center;margin-bottom:clamp(22px,4.5vw,30px)}

  .avatar{
    position:relative;
    width:104px;height:104px;
    margin:0 auto 18px;
    border-radius:50%;
    padding:2.5px;
    background:linear-gradient(150deg,var(--violet-hi),var(--violet-lo) 55%,rgba(255,255,255,.12));
    box-shadow:0 0 40px -8px rgba(139,92,246,.55);
  }
  .avatar > *{
    width:100%;height:100%;
    border-radius:50%;
    display:block;
    object-fit:cover;
    background:#140f26;
  }
  .avatar .glyph{display:grid;place-items:center}
  .avatar .glyph svg{width:50px;height:50px}

  h1{
    margin:0;
    font-size:clamp(27px,6.4vw,34px);
    font-weight:650;
    letter-spacing:-.02em;
  }
  h1 .sep{color:var(--violet-hi);font-weight:400;margin:0 .18em}

  .tagline{
    margin:12px auto 0;
    max-width:22ch;
    font-size:clamp(15px,3.9vw,17px);
    font-weight:500;
    line-height:1.35;
    background:linear-gradient(100deg,#fff 10%,var(--violet-hi) 92%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .proof{
    margin:16px auto 0;
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:6px 14px 6px 11px;
    border:1px solid rgba(139,92,246,.28);
    border-radius:999px;
    background:rgba(139,92,246,.09);
    font-size:12.5px;
    color:#cfc6ea;
  }
  .proof .dot{
    width:6px;height:6px;border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 0 3px rgba(74,222,128,.18);
  }

  /* ================= section headings ================= */
  /* Eight links in one undifferentiated column reads as a wall. Chunking
     them into three labelled groups is what keeps the page scannable. */

  .group-label{
    display:flex;align-items:center;gap:13px;
    margin:26px 0 13px;
    font-size:10.5px;font-weight:600;
    letter-spacing:.19em;text-transform:uppercase;
    color:var(--muted);
  }
  .group-label::before,.group-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .group:first-of-type .group-label{margin-top:0}

  /* ================= link cards ================= */

  .links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}

  .link{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 17px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--card);
    color:inherit;
    text-decoration:none;
    transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .link:hover,.link:focus-visible{
    background:var(--card-hi);
    border-color:rgba(167,139,250,.45);
    transform:translateY(-2px);
    box-shadow:0 10px 30px -14px rgba(139,92,246,.7);
  }
  .link:focus-visible{outline:2px solid var(--violet-hi);outline-offset:3px}
  .link:active{transform:translateY(0)}

  .link .icon{
    flex:none;
    width:42px;height:42px;
    display:grid;place-items:center;
    border-radius:12px;
    background:rgba(139,92,246,.13);
    color:var(--violet-hi);
  }
  .link .icon svg{width:21px;height:21px;display:block}

  /* Banner cards: the artwork spans the card and carries the product name,
     so the strip beneath it only needs the promise and the arrow. At 10:3 the
     card comes out shorter than the old thumbnail-beside-text version. */
  .link.banner,
  .link.banner.featured{display:block;padding:0;overflow:hidden}
  .link.banner .art{display:block;width:100%;aspect-ratio:10/3;background:#0d0b16}
  .link.banner .art img{width:100%;height:100%;display:block;object-fit:cover}
  .link.banner .foot{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px 14px;
    border-top:1px solid rgba(255,255,255,.06);
  }
  .link.banner .foot .sub{flex:1;margin-top:0}

  .link .body{min-width:0;flex:1}
  .link .title{display:block;font-weight:600;font-size:16px;letter-spacing:-.01em}
  .link .sub{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    line-clamp:2;
    overflow:hidden;
    margin-top:2px;
    color:var(--muted);
    font-size:13px;
  }

  .link .arrow{flex:none;color:var(--muted);transition:transform .18s ease,color .18s ease}
  .link:hover .arrow,.link:focus-visible .arrow{color:var(--violet-hi);transform:translateX(3px)}
  .link .arrow svg{width:16px;height:16px;display:block}

  /* featured: the one card that should out-pull the rest */
  .link.featured{
    padding:19px 17px;
    border-color:rgba(167,139,250,.42);
    background:
      linear-gradient(140deg,rgba(139,92,246,.20),rgba(99,72,220,.07) 60%,transparent),

    box-shadow:0 0 34px -16px rgba(139,92,246,.85);
  }
  .link.featured .icon{
    width:46px;height:46px;
    background:linear-gradient(150deg,var(--violet),var(--violet-lo));

  .link.featured .title{font-size:17.5px}
  .link.featured .sub{font-size:13.5px}

     right — on a phone the right-hand pill squeezed the title into a wrap
     and clipped the subtitle. */
  .link.featured .eyebrow{
    display:inline-block;
    margin-bottom:5px;
    font-size:9.5px;font-weight:700;
    letter-spacing:.11em;text-transform:uppercase;
    color:var(--violet-hi);
    background:rgba(139,92,246,.16);
    border:1px solid rgba(167,139,250,.34);
    border-radius:999px;
    padding:2px 8px;

    border-color:rgba(37,211,102,.42);
    box-shadow:0 10px 30px -14px rgba(37,211,102,.55);
  }
  .link.chat:hover .arrow,.link.chat:focus-visible .arrow{color:#25d366}

  .badge{
    flex:none;
    font-size:10px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--violet-hi);
    background:rgba(139,92,246,.15);
    border:1px solid rgba(167,139,250,.34);
    border-radius:999px;
    padding:3px 9px;

  .link.pending{opacity:.45;cursor:default}
  .link.pending:hover{background:var(--card);border-color:var(--line);transform:none;box-shadow:none}
  .link.pending .icon{background:rgba(255,255,255,.05);color:var(--muted)}
  .link.pending .badge{color:var(--muted);background:none;border-color:var(--line)}

  .quote{
    margin:26px 0 0;
    padding:18px 19px;
    border:1px solid var(--line);
    border-left:2px solid var(--violet);
    border-radius:14px;
    background:rgba(255,255,255,.028);

  .quote p{
    margin:0;
    font-size:14.5px;
    line-height:1.6;

  }
  .quote footer{
    margin-top:11px;
    font-size:12px;
    color:var(--muted);

    display:flex;align-items:center;gap:13px;
    margin:28px 0 16px;
    color:var(--muted);
    font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;

  .socials a{

  .socials .txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .socials .txt > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .socials a:hover,.socials a:focus-visible{

  .socials a:focus-visible{outline:2px solid var(--violet-hi);outline-offset:3px}
  .socials svg{width:18px;height:18px;color:var(--violet-hi);display:block;flex:none}
  .socials .handle{color:var(--muted);font-weight:400;font-size:11.5px}

  footer.page .disclaimer{

    max-width:46ch;
    font-size:11px;

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
    .reveal{animation:none}
    .link:hover,.socials a:hover{transform:none}
  }
</style>

  molecule:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="7" r="2.6"/><circle cx="17.5" cy="6" r="2.6"/><circle cx="11" cy="17.5" r="2.6"/><path d="M9.09 6.76 14.91 6.24M7.52 9.39 9.98 15.11M16.22 8.26 12.28 15.24"/></svg>',
  /* reading people — dark psychology */
  eye:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6.1 5.5 12 5.5 21.5 12 21.5 12 17.9 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  /* deliberate practice — the game */
  target:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></svg>',
  whatsapp:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2a8.8 8.8 0 0 0-7.5 13.4L3.2 20.8l4.4-1.2A8.8 8.8 0 1 0 12 3.2z"/><path d="M8.9 8.4c.2-.4.3-.4.5-.4h.5c.2 0 .4 0 .5.4l.6 1.4c.1.2 0 .4-.1.5l-.4.5c-.1.1-.1.3 0 .5a5.8 5.8 0 0 0 2.4 2.1c.2.1.4.1.5 0l.5-.6c.1-.2.3-.2.5-.1l1.4.7c.2.1.3.2.3.4a1.7 1.7 0 0 1-1.2 1.4c-.5.1-1.1.2-3-.8a8.2 8.2 0 0 1-3.2-3.5c-.4-1-.4-1.7-.3-2z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>',
  tiktok:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.2v11.4a3.6 3.6 0 1 1-3.6-3.6"/><path d="M14 3.2c.4 2.7 2.3 4.3 5.1 4.5"/></svg>',
  link:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7L12.2 19"/></svg>'
};

const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';

const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const isLive = url => Boolean(url) && url !== "#";

/* Avatar: your photo if one is set, otherwise the Arcane mark. */
document.getElementById("avatar").innerHTML = AVATAR
  ? `<img src="${esc(AVATAR)}" alt="Leo Gray">`
  : `<span class="glyph" style="color:var(--violet-hi)">${ICONS.mark}</span>`;

document.getElementById("proof-text").textContent = PROOF;

/* Split the flat list into groups on each { section } marker, so the source
   stays one readable top-to-bottom list but the markup gets real headings. */
const groups = [];
for (const item of LINKS) {
  if (item.section) { groups.push({ label: item.section, items: [] }); continue; }
  if (!groups.length) groups.push({ label: null, items: [] });
  groups[groups.length - 1].items.push(item);
}

let step = 0;   // drives the staggered entrance across every group

const card = item => {
  const live = isLive(item.url);
  const external = /^https?:/i.test(item.url || "");

  const cls = ["link", item.banner ? "banner" : "", item.featured ? "featured" : "",
               item.style || "", live ? "" : "pending"].filter(Boolean).join(" ");

  const attrs = live
    ? `href="${esc(item.url)}"${external ? ' target="_blank" rel="noopener noreferrer"' : ""}`
    : 'aria-disabled="true"';

  const eyebrow = live && item.featured && item.badge
    ? `<span class="eyebrow">${esc(item.badge)}</span>` : "";

  const right = live
    ? `${item.badge && !item.featured ? `<span class="badge">${esc(item.badge)}</span>` : ""}<span class="arrow" aria-hidden="true">${ARROW}</span>`
    : `<span class="badge">Soon</span>`;

  /* Banner card: the image names the product, so the alt text is the link's
     accessible name and no separate title row is needed. */
  if (item.banner) return `
    <li class="reveal" style="--i:${step++}">
      <a class="${cls}" ${attrs}>
        <span class="art"><img src="${esc(item.banner)}" alt="${esc(item.title)}"
              width="1200" height="360" loading="lazy" decoding="async"></span>
        <span class="foot">
          <span class="sub">${esc(item.sub || "")}</span>
          ${item.badge ? `<span class="badge">${esc(item.badge)}</span>` : ""}
          <span class="arrow" aria-hidden="true">${ARROW}</span>
        </span>
      </a>
    </li>`;

  return `
    <li class="reveal" style="--i:${step++}">
      <a class="${cls}" ${attrs}>
        <span class="icon" aria-hidden="true">${ICONS[item.icon] || ICONS.link}</span>
        <span class="body">
          ${eyebrow}
          <span class="title">${esc(item.title)}</span>
          ${item.sub ? `<span class="sub">${esc(item.sub)}</span>` : ""}
        </span>
        ${right}
      </a>
    </li>`;
};

document.getElementById("links").innerHTML = groups.map(g => `
  <section class="group">
    ${g.label ? `<h2 class="group-label reveal" style="--i:${step++}">${esc(g.label)}</h2>` : ""}
    <ul class="links">${g.items.map(card).join("")}</ul>
  </section>`).join("");

const quoteEl = document.getElementById("quote");
if (QUOTE && QUOTE.text) {
  quoteEl.innerHTML =
    `<p>&ldquo;${esc(QUOTE.text)}&rdquo;</p><footer>${esc(QUOTE.from || "")}</footer>`;
} else {
  quoteEl.remove();
}

document.getElementById("socials").innerHTML = SOCIALS.filter(s => isLive(s.url)).map(s => `
  <li>
    <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">
      <span aria-hidden="true">${ICONS[s.icon] || ICONS.link}</span>
      <span class="txt">
        <span>${esc(s.name)}</span>
        <span class="handle">${esc(s.handle || "")}</span>
      </span>
    </a>
  </li>`).join("");

document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
