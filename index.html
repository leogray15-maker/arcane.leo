<style>
  :root{
    --bg:#08070d;
    --violet:#8b5cf6;
    --violet-lo:#6d4df0;
    --violet-hi:#a78bfa;
    --card:rgba(255,255,255,.04);
    --card-hi:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.09);
    --text:#f4f2f8;
    --muted:#9b96ac;
    --radius:18px;
    --maxw:600px;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  body{
    margin:0;
    min-height:100svh;
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:clamp(20px,5vw,42px) 16px 40px;
  }

  /* The ambient glow. The top lobe is deliberately strong — it sits behind
     Hero 1 and is half of what makes the primary offer read as the brightest
     thing on the page before anyone has read a word. */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(74% 44% at 50% -6%, rgba(109,77,240,.34) 0%, transparent 68%),
      radial-gradient(50% 34% at 8% 42%, rgba(139,92,246,.10) 0%, transparent 70%),
      radial-gradient(58% 40% at 100% 104%, rgba(76,60,160,.20) 0%, transparent 70%);
  }

  main{position:relative;width:100%;max-width:var(--maxw)}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .reveal{animation:rise .5s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--i,0) * 70ms)}

  /* ================= identity strip =================
     Kept to one short row rather than the old stacked block. Every pixel it
     gives up is a pixel of Hero 1 that lands above the fold. */

  .ident{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:clamp(18px,4vw,24px);
  }

  .avatar{
    position:relative;
    flex:none;
    width:60px;height:60px;
    border-radius:50%;
    padding:2px;
    background:linear-gradient(150deg,var(--violet-hi),var(--violet-lo) 55%,rgba(255,255,255,.12));
    box-shadow:0 0 30px -8px rgba(139,92,246,.6);
  }
  .avatar > *{
    width:100%;height:100%;
    border-radius:50%;
    display:block;
    object-fit:cover;
    background:#140f26;
  }
  .avatar .glyph{display:grid;place-items:center}
  .avatar .glyph svg{width:29px;height:29px}

  .ident .who{min-width:0}
  .ident .name{
    font-size:17px;
    font-weight:650;
    letter-spacing:-.015em;
  }
  .ident .name .sep{color:var(--violet-hi);font-weight:400;margin:0 .3em}

  .proof{
    margin-top:5px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:4px 11px 4px 9px;
    border:1px solid rgba(139,92,246,.28);
    border-radius:999px;
    background:rgba(139,92,246,.09);
    font-size:11.5px;
    color:#cfc6ea;
  }
  .proof .dot{
    width:5px;height:5px;border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 0 3px rgba(74,222,128,.18);
  }

  /* ================= the three tiers =================
     One offer per screen instead of eight cards of equal weight. Hero 1 is
     bigger, brighter and glows; 2 and 3 are flat cards carrying their own
     product colour. The hierarchy is the whole point — resist levelling it. */

  .tier{
    position:relative;
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:22px;
    background:var(--card);
    padding:clamp(20px,5vw,26px);
  }
  .tier + .tier{margin-top:clamp(13px,3vw,16px)}

  .tier.primary{
    margin-bottom:clamp(18px,4vw,24px);
    padding:clamp(24px,6vw,34px) clamp(20px,5vw,30px) clamp(22px,5vw,28px);
    border-color:rgba(167,139,250,.42);
    background:
      radial-gradient(120% 86% at 50% -12%, rgba(139,92,246,.26) 0%, transparent 62%),
      linear-gradient(158deg, rgba(139,92,246,.17) 0%, rgba(99,72,220,.06) 52%, transparent 88%),
      rgba(255,255,255,.05);
    box-shadow:
      0 0 64px -22px rgba(139,92,246,.95),
      inset 0 1px 0 rgba(255,255,255,.07);
  }

  /* The mark, oversized and barely there, centred behind each tier. It takes
     its colour from the tier's accent where there is one, so Peptides ghosts
     orange and Track ghosts green. height:auto matters — Track's lockup is
     taller than it is wide and would squash under a fixed height. */
  .tier .watermark{
    position:absolute;
    left:50%;top:50%;
    /* Percentage-first so it stays proportional: a fixed width would be
       near-full-bleed on a phone card and half that on a desktop one. */
    width:min(64%,300px);
    transform:translate(-50%,-50%);
    color:var(--a,var(--violet-hi));
    opacity:.055;
    pointer-events:none;
  }
  .tier .watermark svg{width:100%;height:auto;display:block}

  .tier .inner{position:relative}

  .tier .mark{
    width:48px;height:48px;
    display:grid;place-items:center;
    border-radius:14px;
    border:1px solid var(--a-line);
    background:var(--a-soft);
    color:var(--a);
  }
  .tier .mark svg{width:25px;height:25px;display:block}

  .tier.primary .mark{
    width:58px;height:58px;
    border:none;
    border-radius:17px;
    background:linear-gradient(150deg,var(--violet-hi),var(--violet) 45%,var(--violet-lo));
    color:#fff;
    box-shadow:0 0 30px -8px rgba(139,92,246,.9);
  }
  .tier.primary .mark svg{width:31px;height:31px}

  .tier .eyebrow{
    display:block;
    margin-top:15px;
    font-size:10.5px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;
    color:var(--violet-hi);
  }

  .tier h2{
    margin:12px 0 0;
    font-size:clamp(21px,5.2vw,25px);
    font-weight:650;
    letter-spacing:-.02em;
    line-height:1.2;
  }

  .tier h1{
    margin:12px 0 0;
    font-size:clamp(28px,7.2vw,40px);
    font-weight:700;
    letter-spacing:-.028em;
    line-height:1.13;
    background:linear-gradient(100deg,#fff 18%,var(--violet-hi) 96%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  /* Trading · Business · Mind · Body */
  .tier .dots{
    margin:11px 0 0;
    font-size:11px;font-weight:600;
    letter-spacing:.19em;text-transform:uppercase;
    color:var(--a);
    opacity:.92;
  }
  /* Tracking has to come down with the viewport or the fourth word wraps
     onto a line of its own on a phone. */
  .tier.primary .dots{
    font-size:clamp(10.5px,2.85vw,12.5px);
    letter-spacing:clamp(.13em,.55vw,.21em);
    color:var(--violet-hi);
    opacity:1;
  }
  .tier .dots .sep{opacity:.45;margin:0 .15em}

  .tier .copy{
    margin:13px 0 0;
    font-size:14.5px;
    line-height:1.62;
    color:#c7c1d8;
  }
  .tier.primary .copy{
    max-width:47ch;
    font-size:15.5px;
    line-height:1.66;
    color:#e0daf0;
  }

  /* ================= calls to action ================= */

  .cta{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    margin-top:17px;
    padding:13px 21px;
    border:1px solid var(--a-line);
    border-radius:14px;
    background:var(--a-soft);
    color:var(--a);
    font-size:14.5px;
    font-weight:650;
    letter-spacing:-.01em;
    text-decoration:none;
    transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .cta:hover,.cta:focus-visible{
    background:var(--a-mid);
    border-color:var(--a);
    transform:translateY(-2px);
    box-shadow:0 12px 30px -16px var(--a-glow);
  }
  .cta:focus-visible{outline:2px solid var(--a);outline-offset:3px}
  .cta:active{transform:translateY(0)}
  .cta svg{width:16px;height:16px;display:block;transition:transform .18s ease}
  .cta:hover svg,.cta:focus-visible svg{transform:translateX(3px)}

  /* the primary CTA is full-width, filled and glowing — 2 and 3 are not */
  .tier.primary .cta{
    display:flex;
    width:100%;
    margin-top:21px;
    padding:17px 22px;
    border:none;
    border-radius:15px;
    background:linear-gradient(120deg,var(--violet-hi) 0%,var(--violet) 42%,var(--violet-lo) 100%);
    color:#fff;
    font-size:clamp(15px,4vw,17px);
    font-weight:700;
    box-shadow:
      0 14px 36px -14px rgba(139,92,246,1),
      inset 0 1px 0 rgba(255,255,255,.28);
  }
  .tier.primary .cta:hover,.tier.primary .cta:focus-visible{
    box-shadow:
      0 18px 44px -12px rgba(139,92,246,1),
      inset 0 1px 0 rgba(255,255,255,.34);
  }

  /* Feature chips. Deliberately small and low-contrast: they are there to be
     scanned, not read, and a loud list here would start competing with
     Hero 1. The three features worth selling are in the copy instead. */
  .tier .feats{
    list-style:none;
    margin:14px 0 0;
    padding:0;
    display:flex;
    flex-wrap:wrap;
    gap:7px;
  }
  .tier .feats li{
    padding:5px 11px;
    border:1px solid var(--a-line);
    border-radius:999px;
    background:var(--a-soft);
    color:#c2bcd2;
    font-size:11.5px;
    line-height:1.35;
  }

  /* research-use line. Sits under its own button, not in the footer, because
     that is where it has to be read to mean anything. */
  .tier .fineprint{
    margin:10px 0 0;
    font-size:11px;
    line-height:1.55;
    color:var(--muted);
  }

  /* ================= the archive list =================
     Always visible. It used to be a collapsed <details>; showing it outright
     costs Hero 1 nothing, because it sits below the button rather than above
     it, and it saves the one tap that was standing between a single-topic
     buyer and the thing they came for. */

  .archive-list{
    margin-top:22px;
    padding-top:19px;
    border-top:1px solid rgba(255,255,255,.08);
  }
  .archive-list .lede{
    margin:0;
    font-size:13px;
    font-weight:550;
    color:var(--violet-hi);
  }
  .archive-list .note{
    margin:6px 0 13px;
    font-size:11.5px;
    line-height:1.5;
    color:var(--muted);
  }

  /* ================= compact product rows ================= */

  .mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

  .mini{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 13px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(255,255,255,.03);
    color:inherit;
    text-decoration:none;
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  .mini:hover,.mini:focus-visible{
    background:var(--a-soft);
    border-color:var(--a-line);
    transform:translateX(2px);
  }
  .mini:focus-visible{outline:2px solid var(--a);outline-offset:3px}

  .mini .g{
    flex:none;
    width:34px;height:34px;
    display:grid;place-items:center;
    border-radius:10px;
    border:1px solid var(--a-line);
    background:var(--a-soft);
    color:var(--a);
  }
  .mini .g svg{width:18px;height:18px;display:block}

  .mini .b{min-width:0;flex:1}
  .mini .t{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .mini .s{display:block;margin-top:1px;font-size:12px;line-height:1.42;color:var(--muted)}

  .mini .arrow{flex:none;color:var(--muted);transition:transform .18s ease,color .18s ease}
  .mini:hover .arrow,.mini:focus-visible .arrow{color:var(--a);transform:translateX(3px)}
  .mini .arrow svg{width:15px;height:15px;display:block}

  .mini .badge{
    flex:none;
    font-size:9.5px;font-weight:700;
    letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 8px;
  }

  .mini.pending{opacity:.5;cursor:default}
  .mini.pending:hover{background:rgba(255,255,255,.03);border-color:var(--line);transform:none}
  .mini.pending .g{color:var(--muted);background:rgba(255,255,255,.05);border-color:var(--line)}

  /* ================= testimonial =================
     Sits under Arcane Track, which is what it is actually describing. It used
     to sit beside the peptide shop, which sells for research use only — the
     wrong claim next to the wrong product. */

  .quote{
    margin:clamp(20px,4.5vw,26px) 0 0;
    padding:18px 19px;
    border:1px solid var(--line);
    border-left:2px solid var(--violet);
    border-radius:14px;
    background:rgba(255,255,255,.028);
  }
  .quote p{
    margin:0;
    font-size:14.5px;
    line-height:1.6;
    color:#ded9ea;
  }
  .quote footer{
    margin-top:11px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  /* ================= dividers, socials, footer ================= */

  .divider{
    display:flex;align-items:center;gap:13px;
    margin:26px 0 14px;
    color:var(--muted);
    font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .socials{
    list-style:none;margin:0;padding:0;
    display:flex;gap:11px;
  }
  .socials li{flex:1 1 0;min-width:0}
  .socials a{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:13px;
    background:var(--card);
    color:var(--text);
    text-decoration:none;
    font-size:13.5px;font-weight:550;
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  .socials .txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .socials .txt > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .socials a:hover,.socials a:focus-visible{
    background:var(--card-hi);
    border-color:rgba(167,139,250,.45);
    transform:translateY(-2px);
  }
  .socials a:focus-visible{outline:2px solid var(--violet-hi);outline-offset:3px}
  .socials svg{width:18px;height:18px;color:var(--violet-hi);display:block;flex:none}
  .socials .handle{color:var(--muted);font-weight:400;font-size:11.5px}

  footer.page{margin-top:32px;text-align:center;color:var(--muted);font-size:12px}
  footer.page .disclaimer{
    margin:0 auto 12px;
    max-width:46ch;
    font-size:11px;
    line-height:1.6;
    opacity:.72;
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
    .reveal{animation:none}
    .tier .cta:hover,.mini:hover,.socials a:hover{transform:none}
  }
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c =>

   element so a product's colour lives in one place in the data above. */
const tint = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};
const accent = hex => `--a:${hex};--a-soft:${tint(hex,.13)};` +
                      `--a-mid:${tint(hex,.21)};--a-line:${tint(hex,.34)};` +
                      `--a-glow:${tint(hex,.6)}`;

/* "Trading · Business · Mind · Body" — the separators get their own opacity */
const dots = s => esc(s).replace(/·/g, '<span class="sep">·</span>');

const href = url => /^https?:/i.test(url)
  ? `href="${esc(url)}" target="_blank" rel="noopener noreferrer"`
  : `href="${esc(url)}"`;

  const live = isLive(item.url);
  return `
    <li>
      <a class="mini${live ? "" : " pending"}" style="${accent(item.accent)}"
         ${live ? href(item.url) : 'aria-disabled="true"'}>
        <span class="g" aria-hidden="true">${ICONS[item.icon] || ICONS.link}</span>

        </span>
        ${live
          ? `<span class="arrow" aria-hidden="true">${ARROW}</span>`
          : `<span class="badge">Soon</span>`}
